{% extends "base.html" %}
{% block title %}Вход — ЖКУ-Учёт{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm">
    <div class="card-body">
        <div class="auth-hero">
            <i class="bi bi-house-gear"></i>
            <h1 class="h3 mt-2">Вход в систему</h1>
            <p class="text-muted mb-0">Учёт показаний и расчёт коммунальных платежей</p>
        </div>
        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if request.args.get('next') %}
            <input type="hidden" name="next" value="{{ request.args.get('next') }}">
            {% endif %}
            <div class="mb-3">
                <label for="username" class="form-label">Имя пользователя</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                           value="{{ username or '' }}" autocomplete="username" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                <label class="form-check-label" for="remember">Запомнить меня</label>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Войти</button>
        </form>
        <p class="text-center mt-4 mb-0">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрируйтесь</a></p>
    </div>
</div>
{% endblock %}
