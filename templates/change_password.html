{% extends "base.html" %}
{% block title %}Смена пароля — ЖКУ-Учёт{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1 class="h3">Смена пароля</h1>
        <p class="page-subtitle">Минимальная длина нового пароля — 8 символов</p>
    </div>
    <a href="{{ url_for('auth.profile') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Назад</a>
</div>

<div class="row">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <form method="post" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Текущий пароль</label>
                        <input type="password" class="form-control" id="current_password" name="current_password"
                               autocomplete="current-password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">Новый пароль</label>
                        <input type="password" class="form-control" id="new_password" name="new_password"
                               minlength="8" autocomplete="new-password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password2" class="form-label">Повторите новый пароль</label>
                        <input type="password" class="form-control" id="new_password2" name="new_password2"
                               minlength="8" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-key me-1"></i>Сменить пароль</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
